name: Container
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions: {}
concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  node-quality:
    permissions:
      contents: read
    uses: roshan46/gha-reusable-workflows/.github/workflows/node-quality.yml@e404a35011dc89c1d810ddac3bf5f238dfc8180f
    with:
      node-version: '24.14.0'

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/install-tool.sh trivy
      - run: docker build -t lab:ci .
      - name: Smoke test running container
        run: |
          docker run -d --name lab -p 127.0.0.1:3000:3000 lab:ci
          for i in {1..20}; do
            if curl --fail http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs lab
          exit 1
      - run: mkdir -p reports && trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/image.json lab:ci
      - run: trivy image --format cyclonedx --output reports/sbom.cdx.json lab:ci
      - run: docker save lab:ci -o image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image
          path: image.tar
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: container-reports
          path: reports/
          retention-days: 7
      - if: always()
        run: docker rm -f lab
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, security, codeql]
    environment: registry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check freshness and required checks before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-latest.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: image
      - name: Publish the already-tested image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load -i image.tar
          docker tag lab:ci "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$GITHUB_SHA" | cut -d@ -f2)
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Released %s@%s from %s\n' "$image" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
