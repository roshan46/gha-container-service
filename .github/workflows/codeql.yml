name: CodeQL
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@48870fdd6b42ee6474ec4207209ff87609271a5e
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@48870fdd6b42ee6474ec4207209ff87609271a5e
        with:
          output: sarif
          upload: false
      - name: Block high and critical findings
        run: node scripts/gate-sarif.mjs sarif
      - uses: github/codeql-action/upload-sarif@48870fdd6b42ee6474ec4207209ff87609271a5e
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: codeql-report
          path: sarif/
          retention-days: 3
